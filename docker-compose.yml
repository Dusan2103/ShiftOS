services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shiftos
      POSTGRES_PASSWORD: shiftos
      POSTGRES_DB: shiftos
    ports:
      - '5432:5432'
    volumes:
      - shiftos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shiftos -d shiftos']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shiftos_pgdata:
